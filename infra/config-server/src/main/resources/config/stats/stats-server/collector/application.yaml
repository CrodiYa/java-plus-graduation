server:
  port: 0

spring.output.ansi.enabled: ALWAYS

grpc:
  server:
    port: 0
  client:
    collector:
      address: 'discovery:///collector'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
collector:
  kafka:
    producer:
      properties:
        bootstrap.servers: localhost:9092
        key.serializer: org.apache.kafka.common.serialization.VoidDeserializer
        value.serializer: ru.practicum.ewm.serializer.GeneralAvroSerializer
    topic:
      actions: "stats.user-actions.v1"