server:
  port: 0
spring:
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ewm
    username: ${DB_USERNAME:ewm}
    password: ${DB_PASSWORD:ewm}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

stats-service:
  uri: lb://stats-service

eureka:
  instance:
    hostname: localhost
    preferIpAddress: false
    instance-id: main-service:${random.value}