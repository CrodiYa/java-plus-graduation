server:
  port: 8080
spring:
  output:
    ansi:
      enabled: ALWAYS
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: requests_all
          uri: lb://participation-service
          predicates:
            - Path=/users/*/requests/**, /users/{userId}/events/{eventId}/requests/**
        - id: comments_all
          uri: lb://comment-service
          predicates:
            - Path=/events/*/comment/**, /users/{userId}/events/{eventId}/comment/**, /users/{userId}/events/comment/**, /admin/events/{eventId}/comment/**
        - id: events_all
          uri: lb://event-service
          predicates:
            - Path=/events/**, /users/*/events/**, /admin/events/**
        - id: categories_all
          uri: lb://event-service
          predicates:
            - Path=/categories/**, /admin/categories/**
        - id: compilations_all
          uri: lb://event-service
          predicates:
            - Path=/compilations/**, /admin/compilations/**
        - id: users_all
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**