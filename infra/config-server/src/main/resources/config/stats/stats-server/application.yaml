server:
  port: 0
spring:
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/stats
    username: ${DB_USERNAME:stats}
    password: ${DB_PASSWORD:stats}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

eureka:
  instance:
    hostname: localhost
    preferIpAddress: false
    instance-id: stats-service:${random.value}